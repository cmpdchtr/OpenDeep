[project]
name = "opendeep"
version = "0.9.0"
description = "A lightweight, unofficial Python library for free DeepSeek API access."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi>=0.7.0",
    "requests>=2.31.0",
    "wasmtime>=18.0.0",
    "numpy>=1.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pyright]
typeCheckingMode = "strict"
include = ["opendeep"]
reportUnusedClass = "none"
reportUnusedFunction = "none"
reportPrivateUsage = "none"
reportUnnecessaryIsInstance = "none"
reportAttributeAccessIssue = "none"
reportUnknownMemberType = "none"
